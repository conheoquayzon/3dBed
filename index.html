<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
      model-viewer { width: 100%; height: 100vh; }
    </style>
  </head>
  <body>
    <model-viewer 
  src="https://www.dropbox.com/scl/fi/uu06sjkiikc7iajs5vsqk/AverinAvR_draco.glb?rlkey=rw027mpfxeogplrisa4alsmtv&st=jivqoxlx&dl=1"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      tone-mapping="neutral" 
      shadow-intensity="1"
      camera-orbit="0deg 70deg auto"
      field-of-view="auto"
      auto-rotate>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
